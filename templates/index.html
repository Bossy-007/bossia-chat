<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BossIA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { display: flex; height: 100vh; background-color: #0f0f11; color: #fff; }
        
        /* Sidebar */
        #sidebar { width: 260px; background: #18181c; border-right: 1px solid #28282e; display: flex; flex-direction: column; padding: 15px; }
        #new-chat-btn { background: #2b2b36; color: #fff; border: 1px solid #3f3f4e; padding: 10px; border-radius: 8px; cursor: pointer; margin-bottom: 15px; font-weight: bold; }
        #new-chat-btn:hover { background: #383846; }
        #chat-list { flex: 1; overflow-y: auto; list-style: none; }
        .chat-item { padding: 10px; border-radius: 6px; cursor: pointer; margin-bottom: 5px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-item:hover, .chat-item.active { background: #282830; }

        /* Main Chat Area */
        #main { flex: 1; display: flex; flex-direction: column; height: 100vh; }
        #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 70%; padding: 12px 16px; border-radius: 12px; font-size: 15px; line-height: 1.4; }
        .user { align-self: flex-end; background: #3b82f6; color: white; }
        .bot { align-self: flex-start; background: #23232a; border: 1px solid #33333d; }

        /* Input Area */
        #input-area { padding: 15px; border-top: 1px solid #28282e; display: flex; gap: 10px; }
        input { flex: 1; background: #18181c; border: 1px solid #33333d; padding: 12px; border-radius: 8px; color: white; outline: none; }
        button { background: #3b82f6; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>

    <div id="sidebar">
        <button id="new-chat-btn" onclick="createNewChat()">+ Nuevo Chat</button>
        <ul id="chat-list"></ul>
    </div>

    <div id="main">
        <div id="messages"></div>
        <div id="input-area">
            <input type="text" id="user-input" placeholder="Escribe tu mensaje..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script>
        let currentChatId = null;

        async function loadChats() {
            const res = await fetch('/api/chats');
            const chats = await res.json();
            const list = document.getElementById('chat-list');
            list.innerHTML = '';
            
            chats.forEach(chat => {
                const li = document.createElement('li');
                li.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
                li.innerText = chat.title || 'Nuevo Chat';
                li.onclick = () => selectChat(chat.id);
                list.appendChild(li);
            });

            if (chats.length > 0 && !currentChatId) {
                selectChat(chats[0].id);
            } else if (chats.length === 0) {
                createNewChat();
            }
        }

        async function createNewChat() {
            const res = await fetch('/api/chats', { method: 'POST' });
            const chat = await res.json();
            currentChatId = chat.id;
            document.getElementById('messages').innerHTML = '';
            loadChats();
        }

        async function selectChat(chatId) {
            currentChatId = chatId;
            loadChats();
            const res = await fetch(`/api/chats/${chatId}/messages`);
            const messages = await res.json();
            
            const container = document.getElementById('messages');
            container.innerHTML = '';
            messages.forEach(m => {
                appendMessage(m.role === 'user' ? 'user' : 'bot', m.content);
            });
        }

        function appendMessage(role, text) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            div.innerText = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text || !currentChatId) return;

            appendMessage('user', text);
            input.value = '';

            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text, chat_id: currentChatId })
            });

            const data = await res.json();
            if (data.response) {
                appendMessage('bot', data.response);
                loadChats();
            } else {
                appendMessage('bot', 'Error al procesar la respuesta.');
            }
        }

        loadChats();
    </script>
</body>
</html>
