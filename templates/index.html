<script>
    document.addEventListener('DOMContentLoaded', () => {
        let currentChatId = null;

        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggle-btn');
        const newChatBtn = document.getElementById('new-chat-btn');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');
        const chatList = document.getElementById('chat-list');

        // Abrir / Cerrar Sidebar
        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('open');
        });

        // Función para añadir mensaje a la pantalla
        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}-message`;
            const p = document.createElement('p');
            p.innerText = text;
            div.appendChild(p);
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Cargar y mostrar TODOS los chats acumulados
        async function loadChats() {
            try {
                const res = await fetch('/api/chats');
                const chats = await res.json();
                chatList.innerHTML = '';

                if (Array.isArray(chats) && chats.length > 0) {
                    chats.forEach(chat => {
                        const li = document.createElement('li');
                        li.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
                        li.innerText = chat.title || 'Nuevo Chat';
                        li.addEventListener('click', () => selectChat(chat.id));
                        chatList.appendChild(li);
                    });

                    // Si no hay un chat seleccionado, seleccionamos el primero
                    if (!currentChatId) {
                        selectChat(chats[0].id);
                    }
                } else {
                    // Si la base de datos no tiene chats, creamos el primero
                    createNewChat();
                }
            } catch (e) {
                console.error("Error al cargar lista de chats:", e);
            }
        }

        // Crear un nuevo chat sin borrar los anteriores de la lista
        async function createNewChat() {
            try {
                const res = await fetch('/api/chats', { method: 'POST' });
                const chat = await res.json();
                
                // Fijamos el ID del nuevo chat activo
                currentChatId = chat.id;

                // Limpiamos la pantalla de conversación para la nueva sesión
                chatBox.innerHTML = `
                    <div class="message system-welcome">
                        <p>Hola. ¿En qué te puedo colaborar hoy?</p>
                    </div>`;

                // Recargamos la lista para que aparezca el nuevo + todos los anteriores
                await loadChats();
            } catch (e) {
                console.error("Error al crear chat:", e);
            }
        }

        newChatBtn.addEventListener('click', createNewChat);

        // Seleccionar y recuperar mensajes de un chat del historial
        async function selectChat(chatId) {
            currentChatId = chatId;
            
            // Actualizar clase 'active' visual en la lista
            const items = chatList.querySelectorAll('.chat-item');
            items.forEach(item => item.classList.remove('active'));

            try {
                const res = await fetch(`/api/chats/${chatId}/messages`);
                const messages = await res.json();
                chatBox.innerHTML = '';

                if (!messages || messages.length === 0) {
                    chatBox.innerHTML = `
                        <div class="message system-welcome">
                            <p>Hola. ¿En qué te puedo colaborar hoy?</p>
                        </div>`;
                } else {
                    messages.forEach(m => {
                        appendMessage(m.role === 'user' ? 'user' : 'bot', m.content);
                    });
                }

                // Cargar lista de chats para mantener resaltado el activo
                const updatedChats = await (await fetch('/api/chats')).json();
                chatList.innerHTML = '';
                updatedChats.forEach(chat => {
                    const li = document.createElement('li');
                    li.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
                    li.innerText = chat.title || 'Nuevo Chat';
                    li.addEventListener('click', () => selectChat(chat.id));
                    chatList.appendChild(li);
                });

            } catch (e) {
                console.error("Error al seleccionar chat:", e);
            }
        }

        // Enviar mensaje
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('user', text);
            userInput.value = '';

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, chat_id: currentChatId })
                });

                const data = await res.json();
                if (data.response) {
                    appendMessage('bot', data.response);
                    // Actualizamos la lista porque el servidor cambia el título al primer mensaje
                    loadChats();
                } else {
                    appendMessage('bot', 'Error del servidor: ' + (data.error || 'No responde.'));
                }
            } catch (err) {
                appendMessage('bot', 'Error de red al conectar con el servidor.');
            }
        });

        // Cargar todo al iniciar
        loadChats();
    });
</script>
