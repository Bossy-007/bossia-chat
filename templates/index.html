<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BossIA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <style>
        /* Estilos integrados exclusivamente para la barra lateral desplegable */
        .sidebar-toggle {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1001;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 20px;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        .sidebar-toggle:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: rgba(15, 15, 17, 0.95);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            transition: left 0.3s ease;
            display: flex;
            flex-direction: column;
            padding: 70px 15px 20px 15px;
            box-sizing: border-box;
        }
        .sidebar.open {
            left: 0;
        }
        .new-chat-btn {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            margin-bottom: 20px;
            transition: background 0.2s;
        }
        .new-chat-btn:hover {
            background: rgba(255, 255, 255, 0.18);
        }
        .chat-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex: 1;
        }
        .chat-item {
            padding: 10px;
            border-radius: 6px;
            color: #ccc;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s;
        }
        .chat-item:hover, .chat-item.active {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
    </style>
</head>
<body>

    <button class="sidebar-toggle" onclick="toggleSidebar()" id="sidebar-btn">☰</button>

    <aside class="sidebar" id="sidebar">
        <button class="new-chat-btn" onclick="createNewChat()">+ Nuevo Chat</button>
        <ul class="chat-list" id="chat-list"></ul>
    </aside>

    <div class="corner corner-tl">007</div>
    <div class="corner corner-tr">bossy</div>
    <div class="corner corner-bl">bossy</div>
    <div class="corner corner-br">007</div>

    <main class="container">
        <header class="brand-header">
            <h1 class="brand-title">BossIA</h1>
            <p class="brand-subtitle">para lo que necesites</p>
        </header>

        <section class="chat-wrapper">
            <div id="chat-box" class="chat-box">
                <div class="message system-welcome">
                    <p>Hola. ¿En qué te puedo colaborar hoy?</p>
                </div>
            </div>

            <form id="chat-form" class="chat-form">
                <input 
                    type="text" 
                    id="user-input" 
                    placeholder="Escribe tu mensaje aquí..." 
                    autocomplete="off"
                    required
                >
                <button type="submit" id="send-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </section>
    </main>

    <script>
        let currentChatId = null;

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        async function loadChats() {
            try {
                const res = await fetch('/api/chats');
                const chats = await res.json();
                const list = document.getElementById('chat-list');
                list.innerHTML = '';
                
                chats.forEach(chat => {
                    const li = document.createElement('li');
                    li.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
                    li.innerText = chat.title || 'Nuevo Chat';
                    li.onclick = () => selectChat(chat.id);
                    list.appendChild(li);
                });

                if (chats.length > 0 && !currentChatId) {
                    selectChat(chats[0].id);
                } else if (chats.length === 0) {
                    createNewChat();
                }
            } catch (e) {
                console.error("Error cargando chats", e);
            }
        }

        async function createNewChat() {
            try {
